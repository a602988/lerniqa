<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">周角答案圖</title>
  <desc id="desc">兩個一百八十度的半圓組成一個三百六十度的周角。</desc>
  <rect width="720" height="280" rx="28" fill="#f7f7fb"/>
  <path d="M220 140a140 100 0 0 1 280 0" fill="none" stroke="#7560d6" stroke-width="12" stroke-linecap="round"/>
  <path d="M500 140a140 100 0 0 1-280 0" fill="none" stroke="#ec77ac" stroke-width="12" stroke-linecap="round"/>
  <text x="360" y="128" fill="#141526" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">180° + 180°</text>
  <text x="360" y="180" fill="#7560d6" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">= 360°</text>
</svg>
