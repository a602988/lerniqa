<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">平角與周角示意圖</title>
  <desc id="desc">左側是一條表示一百八十度的直線，右側是一個表示三百六十度的圓。</desc>
  <rect width="720" height="280" rx="28" fill="#f7f7fb"/>
  <g fill="none" stroke="#7560d6" stroke-width="10" stroke-linecap="round">
    <path d="M90 140h220"/>
    <circle cx="535" cy="140" r="86"/>
  </g>
  <g fill="#141526" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">
    <text x="200" y="205">180°</text>
    <text x="535" y="150">360°</text>
  </g>
</svg>
